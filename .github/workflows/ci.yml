name: CI

on:
  push:
    branches: ["main", "develop", "staging"]
  pull_request:
    branches: ["main", "staging"]

env:
  PYTHON_VERSION:    "3.12"
  NODE_VERSION:      "20"
  REGISTRY:          ghcr.io
  IMAGE_NAME:        ${{ github.repository }}/church-finder-backend

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  backend-ci:
    name: "Backend — lint + typecheck + unit tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check app/ tests/ --output-format=github

      - name: Ruff format check
        run: ruff format --check app/ tests/

      - name: MyPy typecheck
        run: mypy app/ --ignore-missing-imports --strict
        continue-on-error: true

      - name: Pytest unit tests
        run: |
          pytest tests/test_crawler.py \
            -v \
            --tb=short \
            --junitxml=test-results/unit.xml
        env:
          ENV:          "dev"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-unit-test-results
          path: backend/test-results/


  frontend-ci:
    name: "Frontend — typecheck + lint + build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_URL:    "http://localhost:8000"
          VITE_APP_ENV:    "staging"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 3


  integration:
    name: "Integration tests (Postgres)"
    runs-on: ubuntu-latest
    needs: [backend-ci]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB:       churchfinder_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run integration tests
        run: |
          pytest tests/test_api.py \
            -v \
            --tb=short \
            --junitxml=test-results/integration.xml
        env:
          ENV:          "dev"
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/churchfinder_test"

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: backend/test-results/


  docker-build:
    name: "Docker build + smoke test"
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context:  ./backend
          push:     false
          tags:     church-finder-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d \
            --name cf-smoke \
            -p 8000:8000 \
            -e ENV=dev \
            -e DATABASE_URL="sqlite+aiosqlite:///./test.db" \
            church-finder-backend:ci-${{ github.sha }}
          sleep 5
          curl --fail --retry 5 --retry-delay 2 http://localhost:8000/health
          docker stop cf-smoke


  deploy-staging:
    name: "Deploy → staging"
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, integration, docker-build]
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry:  ${{ env.REGISTRY }}
          username:  ${{ github.actor }}
          password:  ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v5
        with:
          context:  ./backend
          push:     true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Deploy to staging host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key:      ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/church-finder
            export IMAGE_TAG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
            docker compose -f docker-compose.staging.yml pull backend
            docker compose -f docker-compose.staging.yml up -d --no-deps backend
            docker system prune -f

      - name: Record deployment in API
        run: |
          curl -X POST ${{ vars.STAGING_URL }}/deployments \
            -H "Content-Type: application/json" \
            -d '{
              "environment":  "staging",
              "version":      "${{ github.sha }}",
              "image_tag":    "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}",
              "deployed_by":  "github-actions",
              "notes":        "Auto-deploy from branch staging"
            }'


  deploy-prod:
    name: "Deploy → production"
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, integration, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ vars.PROD_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry:  ${{ env.REGISTRY }}
          username:  ${{ github.actor }}
          password:  ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v5
        with:
          context:  ./backend
          push:     true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Deploy to production host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key:      ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/church-finder
            export IMAGE_TAG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            docker compose -f docker-compose.prod.yml pull backend
            docker compose -f docker-compose.prod.yml up -d --no-deps backend
            docker system prune -f

      - name: Record deployment in API
        run: |
          curl -X POST ${{ vars.PROD_URL }}/deployments \
            -H "Content-Type: application/json" \
            -d '{
              "environment":  "prod",
              "version":      "${{ github.sha }}",
              "image_tag":    "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}",
              "deployed_by":  "github-actions",
              "notes":        "Production deploy"
            }'

      - name: Post-deploy health check
        run: |
          sleep 10
          curl --fail ${{ vars.PROD_URL }}/health
          