document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

gba(8,9,14,.5)!important;color:var(--txf)!important;font-size:9px!important;}\n  .leaflet-control-attribution a{color:var(--txd)!important;}\n  .tc-root[data-tc-theme=\"light\"] .leaflet-control-attribution{background:rgba(255,255,255,.6)!important;}\n  .tc-region{transition:fill-opacity .25s,stroke-width .2s;cursor:pointer;}\n  .tc-root[data-tc-theme=\"light\"] .tc-poster-map.leaflet-container{background:#e9edf0!important;}\n  .tc-root[data-tc-theme=\"dark\"] .tc-poster-map.leaflet-container{background:#0d1017!important;}\n  /* no focus box on region select — colour highlight is the only indicator */\n  .tc-poster-map .leaflet-interactive:focus,.tc-poster-map path:focus,.tc-poster-map svg:focus,.tc-poster-map svg g:focus{outline:none!important;}\n  .tc-poster-map{cursor:grab;}\n  .tc-poster-map:active{cursor:grabbing;}\n  /* national plate: themed neutral base — silver by day, slate by night */\n  .tc-root[data-tc-theme=\"dark\"] .tc-poster-map .leaflet-tile-pane{filter:grayscale(1) brightness(1.06) contrast(1.05);}\n  .tc-root[data-tc-theme=\"light\"] .tc-poster-map .leaflet-tile-pane{filter:grayscale(1) brightness(1.02) contrast(1.12);}\n  .tc-root[data-tc-theme=\"dark\"] .leaflet-overlay-pane svg{filter:drop-shadow(0 0 5px rgba(238,132,52,.22));}\n  .leaflet-tooltip.tc-tip{background:var(--bg2);border:1px solid var(--bdg);color:var(--tx);font-family:system-ui,sans-serif;font-size:11.5px;border-radius:6px;box-shadow:var(--shadow);padding:6px 10px;}\n  .leaflet-tooltip.tc-tip::before{display:none;}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n<div class=\"tc-root\" data-tc-theme=\"{{ theme }}\" style=\"font-family:'Satoshi',-apple-system,system-ui,sans-serif;color:var(--tx);background:var(--bg);min-height:100vh;\">\n\n  <!-- ════ NAV ════ -->\n  <header style=\"position:sticky;top:0;z-index:1200;backdrop-filter:saturate(150%) blur(18px);-webkit-backdrop-filter:saturate(150%) blur(18px);background:var(--head);border-bottom:1px solid var(--bdg);\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:0 clamp(18px,4vw,40px);height:62px;display:flex;align-items:center;justify-content:space-between;gap:16px;\">\n      <div style=\"display:flex;align-items:center;gap:12px;\">\n        <span aria-label=\"nave\" role=\"img\" style=\"display:inline-flex;color:var(--tx);flex-shrink:0;\"><svg style=\"height:18px;width:auto;display:block\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 660.23 154.29\"><path d=\"M101.23,2.59c15.55,0,30.43,5.15,40.24,13.62,10.48,9.68,14.2,21.19,14.2,46v88.51h-51.39l-2.23-88.21c0-13.62-11.47-21.79-24.65-21.79s-24.99,10.78-24.99,24.4v85.6H1V52.74C1,27.15,22.25,2.54,50.84,3.06c16.23.29,42.98-.47,50.38-.47Z\" fill=\"currentColor\" stroke=\"currentColor\" stroke-miterlimit=\"10\" stroke-width=\"2\"><\u002Fpath><path d=\"M271.03,72.88l-4.3,3.99-4.22-9.31c-2.91-4.9-4.25-5.4-4.8-5.89-2.03-1.81-3.85-3.52-7.97-4.48l-11.44-1.14,4.78-4.2,5.44.21c1.58.06,3.15.28,4.67.7,2.85.79,4.12,1.51,5.94,2.75,2.68,1.83,3.96,3.21,6.17,5.79,1.63,1.91,3.06,4.92,4.22,7.15l1.52,4.43Z\" fill=\"currentColor\"><\u002Fpath><path d=\"M265.4,56.33l-3.25,1c-2.44.75-3.58,2.3-5.76,3.63-2.02,1.23-4.52,7.02-4.61,7.15l-6.42-4.2s2.65-4.64,4.28-6.12c2.41-2.18,5.16-3.93,8.19-5.47,2.24-1.14,7.56,4,7.56,4Z\" fill=\"currentColor\"><\u002Fpath><path d=\"M236.42,2.59c-42.07,0-72.64,32.69-72.64,77.48s28.09,70.65,68.04,70.65h94.18V1.02s-71.73,1.57-89.58,1.57ZM243.1,110.29c-18.76,0-35.29-9.64-35.29-31.13s13.26-33.44,35.59-33.44c19.98,0,34.2,10.44,34.2,32.84,0,21.18-15.43,31.73-34.5,31.73ZM275.32,47.42c-5.47,0-9.92-4.18-9.92-9.32s4.45-9.33,9.92-9.33,9.93,4.18,9.93,9.33-4.45,9.32-9.93,9.32Z\" fill=\"currentColor\" stroke=\"currentColor\" stroke-miterlimit=\"10\" stroke-width=\"2\"><\u002Fpath><path d=\"M533.33,4.72c.25-.84-104.39,122.38-112.3,129.21-16.19,13.98-23.41,19.01-41.02,19.37h-10.18c-19.75,0-35.75-16.02-35.72-35.77l.15-114.36h55.12l-.06,78.09c0,5.36,6.46,12.58,16,1.23L471.87,4.72h61.46Z\" fill=\"currentColor\" stroke=\"currentColor\" stroke-miterlimit=\"10\" stroke-width=\"2\"><\u002Fpath><path d=\"M552,89.07c3.33,15.74,14.67,20.14,31.31,20.14,12.41,0,20.16-4.95,25-14.94l49.97.72c-.56,9.04-4.84,26.08-26.16,41.04-5.51,3.87-19.82,16.27-49.97,16.27-45.7,0-83.68-29.33-83.68-73.82S536.36,2.72,581.75,2.72s77.48,32.78,77.48,80.59v5.75h-107.23ZM609.32,61.55c-3.03-14.53-10.92-19.7-27.26-19.7s-25.33,5.17-28.36,19.7h55.62Z\" fill=\"currentColor\" stroke=\"currentColor\" stroke-miterlimit=\"10\" stroke-width=\"2\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <span style=\"font-size:11px;letter-spacing:.04em;color:var(--txf);padding:3px 9px;border:1px solid var(--bd);border-radius:999px;\">v0.1 · alpha<\u002Fspan>\n      <\u002Fdiv>\n      <nav style=\"display:flex;align-items:center;gap:clamp(10px,2vw,26px);\">\n        <a href=\"#plates\" style=\"text-decoration:none;color:var(--txd);font-size:13px;\" style-hover=\"color:var(--tx);\">Plates<\u002Fa>\n        <a href=\"#color\" style=\"text-decoration:none;color:var(--txd);font-size:13px;\" style-hover=\"color:var(--tx);\">Color<\u002Fa>\n        <a href=\"#type\" style=\"text-decoration:none;color:var(--txd);font-size:13px;\" style-hover=\"color:var(--tx);\">Type<\u002Fa>\n        <a href=\"#components\" style=\"text-decoration:none;color:var(--txd);font-size:13px;\" style-hover=\"color:var(--tx);\">Components<\u002Fa>\n        <a href=\"#map\" style=\"text-decoration:none;color:var(--txd);font-size:13px;\" style-hover=\"color:var(--tx);\">Map<\u002Fa>\n        <button onclick=\"{{ toggleTheme }}\" title=\"Toggle appearance\" style=\"width:32px;height:32px;border-radius:50%;border:1px solid var(--bd);background:var(--bg2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tx);font-size:14px;line-height:1;\" style-hover=\"border-color:var(--bdg);\">{{ themeIcon }}<\u002Fbutton>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- ════ HERO ════ -->\n  <section style=\"position:relative;background:var(--sky);overflow:hidden;border-bottom:1px solid var(--bd);\">\n    <!-- stained-glass lancet band -->\n    <div style=\"position:absolute;inset:0;display:flex;gap:3px;opacity:.12;pointer-events:none;\">\n      <span style=\"flex:1;background:linear-gradient(180deg,#a20021,transparent);\"><\u002Fspan>\n      <span style=\"flex:1;background:linear-gradient(180deg,#f3752b,transparent);\"><\u002Fspan>\n      <span style=\"flex:1;background:linear-gradient(180deg,#ee8434,transparent);\"><\u002Fspan>\n      <span style=\"flex:1;background:linear-gradient(180deg,#717ec3,transparent);\"><\u002Fspan>\n      <span style=\"flex:1;background:linear-gradient(180deg,#496ddb,transparent);\"><\u002Fspan>\n      <span style=\"flex:1;background:linear-gradient(180deg,#c95d63,transparent);\"><\u002Fspan>\n      <span style=\"flex:1;background:linear-gradient(180deg,#f52f57,transparent);\"><\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"position:relative;max-width:1180px;margin:0 auto;padding:clamp(48px,7vw,92px) clamp(18px,4vw,40px) clamp(30px,4vw,52px);animation:tcRise .7s cubic-bezier(.16,1,.3,1) both;\">\n      <p style=\"font-family:'Familjen Grotesk','Satoshi',sans-serif;font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);margin:0 0 18px;\">A Stained-Glass Design System<\u002Fp>\n      <h1 style=\"font-family:'Familjen Grotesk','Satoshi',sans-serif;font-weight:700;font-size:clamp(36px,6vw,72px);line-height:1.02;letter-spacing:-.01em;margin:0;max-width:14ch;text-wrap:balance;\">Light through leaded glass, for public maps.<\u002Fh1>\n      <p style=\"font-size:clamp(16px,1.7vw,19px);line-height:1.6;color:var(--txd);max-width:62ch;margin:22px 0 0;text-wrap:pretty;\">Nave dresses Apple's calm, glass-panelled structure in the jewel palette of a cathedral window — a token set and component kit for public, interactive geospatial dashboards built on OpenStreetMap, GeoJSON, choropleth and Leaflet.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:9px;margin-top:26px;\">\n        <span style=\"display:inline-flex;align-items:center;gap:7px;background:var(--bg2);border:1px solid var(--bd);border-radius:999px;padding:7px 14px;font-size:12.5px;color:var(--txd);\"><span style=\"width:7px;height:7px;border-radius:50%;background:#717ec3;\"><\u002Fspan>OpenStreetMap<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;gap:7px;background:var(--bg2);border:1px solid var(--bd);border-radius:999px;padding:7px 14px;font-size:12.5px;color:var(--txd);\"><span style=\"width:7px;height:7px;border-radius:50%;background:#a20021;\"><\u002Fspan>GeoJSON<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;gap:7px;background:var(--bg2);border:1px solid var(--bd);border-radius:999px;padding:7px 14px;font-size:12.5px;color:var(--txd);\"><span style=\"width:7px;height:7px;border-radius:50%;background:#ee8434;\"><\u002Fspan>Choropleth<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;gap:7px;background:var(--bg2);border:1px solid var(--bd);border-radius:999px;padding:7px 14px;font-size:12.5px;color:var(--txd);\"><span style=\"width:7px;height:7px;border-radius:50%;background:#496ddb;\"><\u002Fspan>Leaflet<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;gap:7px;background:var(--bg2);border:1px solid var(--bd);border-radius:999px;padding:7px 14px;font-size:12.5px;color:var(--txd);\"><span style=\"width:7px;height:7px;border-radius:50%;background:#f52f57;\"><\u002Fspan>Apple HIG structure<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ════ CITY PLATES · terraink-style single-hue posters ════ -->\n  <section id=\"plates\" style=\"max-width:1180px;margin:0 auto;padding:clamp(40px,5vw,68px) clamp(18px,4vw,40px) 0;scroll-margin-top:80px;\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;margin:0 0 6px;\"><span style=\"font-family:'Familjen Grotesk','Satoshi',sans-serif;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);white-space:nowrap;\">Map Plates<\u002Fspan><\u002Fdiv>\n    <h2 style=\"font-family:'Familjen Grotesk','Satoshi',sans-serif;font-weight:600;font-size:clamp(24px,3.2vw,34px);margin:0 0 6px;letter-spacing:-.01em;\">Single-hue city posters<\u002Fh2>\n    <p style=\"font-size:15px;line-height:1.6;color:var(--txd);max-width:64ch;margin:0 0 22px;\">Every glass hue tints a live OpenStreetMap plate — one colour, edge to edge. The print-style frame, wide-tracked place name and decimal coordinates are tokens too. Step through UK cities below.<\u002Fp>\n\n    <div style=\"position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--bd);box-shadow:var(--shadow);height:clamp(440px,62vh,640px);background:{{ plateBg }};\">\n      <!-- filtered live map -->\n      <div ref=\"{{ setPlateHost }}\" style=\"position:absolute;inset:0;filter:{{ plateFilter }};transition:filter .6s ease;\"><\u002Fdiv>\n\n      <!-- top + bottom scrims for legibility -->\n      <div style=\"position:absolute;inset:0;pointer-events:none;background:{{ plateScrim }};\"><\u002Fdiv>\n      <!-- fine inner frame line, like a print border -->\n      <div style=\"position:absolute;inset:14px;pointer-events:none;border:1px solid {{ plateLine }};border-radius:8px;\"><\u002Fdiv>\n\n      <!-- arrows -->\n      <button onclick=\"{{ prevPlate }}\" aria-label=\"Previous city\" style=\"position:absolute;left:18px;top:50%;transform:translateY(-50%);z-index:30;width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;background:rgba(255,255,255,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.18);\" style-hover=\"background:rgba(255,255,255,.92);\">\n        <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#222\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"15 18 9 12 15 6\"><\u002Fpolyline><\u002Fsvg>\n      <\u002Fbutton>\n      <button onclick=\"{{ nextPlate }}\" aria-label=\"Next city\" style=\"position:absolute;right:18px;top:50%;transform:translateY(-50%);z-index:30;width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;background:rgba(255,255,255,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.18);\" style-hover=\"background:rgba(255,255,255,.92);\">\n        <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#222\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"9 18 15 12 9 6\"><\u002Fpolyline><\u002Fsvg>\n      <\u002Fbutton>\n\n      <!-- title block, centered low like terraink -->\n      <div style=\"position:absolute;left:0;right:0;bottom:54px;z-index:20;text-align:center;padding:0 60px;pointer-events:none;\">\n        <h3 style=\"font-family:'Familjen Grotesk','Satoshi',sans-serif;font-weight:600;font-size:clamp(34px,6.4vw,74px);line-height:1;letter-spacing:.16em;margin:0;color:{{ plateColor }};text-indent:.16em;\">{{ plateName }}<\u002Fh3>\n        <div style=\"width:148px;height:1.5px;background:{{ plateColor }};opacity:.7;margin:18px auto 14px;\"><\u002Fdiv>\n        <p style=\"font-family:'Familjen Grotesk','Satoshi',sans-serif;font-size:clamp(13px,1.5vw,16px);letter-spacing:.32em;text-transform:uppercase;margin:0;color:{{ plateColor }};text-indent:.32em;\">{{ plateCountry }}<\u002Fp>\n        <p style=\"font-family:ui-monospace,SFMono-Regular,monospace;font-size:12.5px;letter-spacing:.12em;margin:12px 0 0;color:{{ plateColor }};opacity:.78;\">{{ plateCoords }}<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- corner attributions -->\n      <span style=\"position:absolute;left:24px;bottom:18px;z-index:20;font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.04em;color:{{ plateColor }};opacity:.6;\">© nave.systems<\u002Fspan>\n      <span style=\"position:absolute;right:24px;bottom:18px;z-index:20;font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.04em;color:{{ plateColor }};opacity:.6;\">© OpenStreetMap contributors<\u002Fspan>\n\n      <!-- dots -->\n      <div style=\"position:absolute;left:0;right:0;bottom:18px;z-index:20;display:flex;justify-content:center;gap:9px;\">\n        <sc-for list=\"{{ plateDots }}\" as=\"d\" hint-placeholder-count=\"8\">\n          <button onclick=\"{{ d.go }}\" aria-label=\"Go to plate\" style=\"width:{{ d.size }};height:8px;border-radius:999px;border:none;cursor:pointer;padding:0;background:{{ d.bg }};transition:width .25s,background .25s;\"><\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:11.5px;color:var(--txf);margin:10px 0 0;font-family:ui-monospace,SFMono-Regular,monospace;\">L.tileLayer(positron_nolabels) · CSS filter: grayscale → sepia → hue-rotate → saturate · one hue per plate<\u002Fp>\n  <\u002Fsection>\n\n  <!-- ════ INTERACTIVE NATIONAL PLATE · single-hue choropleth poster ════ -->\n  <section id=\"map\" style=\"max-width:1180px;margin:0 auto;padding:clamp(40px,5vw,68px) clamp(18px,4vw,40px) 0;scroll-margin-top:80px;\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;margin:0 0 8px;\">\n      <span style=\"font-family:'Familjen Grotesk','Satoshi',sans-serif;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);\">The System, Assembled<\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"font-family:'Familjen Grotesk','Satoshi',sans-serif;font-weight:600;font-size:clamp(24px,3.2vw,34px);margin:0 0 6px;letter-spacing:-.01em;\">An interactive national plate<\u002Fh2>\n    <p style=\"font-size:15px;line-height:1.6;color:var(--txd);max-width:64ch;margin:0 0 22px;\">The full poster treatment over a live Leaflet choropleth. Hover any region to light its glass and trace its border; toggle category against density. One hue, edge to edge — on real OpenStreetMap tiles and GeoJSON.<\u002Fp>\n\n    <div style=\"position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--bd);box-shadow:var(--shadow);height:clamp(480px,66vh,680px);background:{{ posterBg }};\">\n      <!-- live single-hue map (tiles tinted via tile-pane filter; choropleth overlay stays vivid) -->\n      <div ref=\"{{ setMapHost }}\" class=\"tc-poster-map\" style=\"position:absolute;inset:0;\"><\u002Fdiv>\n\n      <!-- print scrim + frame -->\n      <div style=\"position:absolute;inset:0;pointer-events:none;z-index:380;background:{{ posterScrim }};\"><\u002Fdiv>\n      <div style=\"position:absolute;inset:14px;pointer-events:none;z-index:381;border:1px solid {{ posterLine }};border-radius:8px;\"><\u002Fdiv>\n\n      <!-- English-only sea label, set over the North Sea -->\n      <span style=\"position:absolute;top:30%;right:11%;z-index:386;pointer-events:none;font-family:'Familjen Grotesk','Satoshi',sans-serif;font-size:clamp(13px,1.5vw,17px);font-weight:500;letter-spacing:.42em;text-transform:uppercase;color:{{ posterColor }};opacity:.5;transform:rotate(-6deg);text-indent:.42em;\">North Sea<\u002Fspan>\n\n      <!-- masthead title, top-left -->\n      <div style=\"position:absolute;top:24px;left:26px;z-index:400;max-width:340px;pointer-events:none;\">\n        <span aria-label=\"nave\" role=\"img\" style=\"display:block;margin:0 0 13px;color:{{ posterColor }};\"><svg style=\"height:15px;width:auto;display:block\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 660.23 154.29\"><path d=\"M101.23,2.59c15.55,0,30.43,5.15,40.24,13.62,10.48,9.68,14.2,21.19,14.2,46v88.51h-51.39l-2.23-88.21c0-13.62-11.47-21.79-24.65-21.79s-24.99,10.78-24.99,24.4v85.6H1V52.74C1,27.15,22.25,2.54,50.84,3.06c16.23.29,42.98-.47,50.38-.47Z\" fill=\"currentColor\" stroke=\"currentColor\" stroke-miterlimit=\"10\" stroke-width=\"2\"><\u002Fpath><path d=\"M271.03,72.88l-4.3,3.99-4.22-9.31c-2.91-4.9-4.25-5.4-4.8-5.89-2.03-1.81-3.85-3.52-7.97-4.48l-11.44-1.14,4.78-4.2,5.44.21c1.58.06,3.15.28,4.67.7,2.85.79,4.12,1.51,5.94,2.75 miljen Grotesk','Satoshi',sans-serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--txf);margin:0 0 4px;\">{{ hoverKicker }}<\u002Fp>\n        <p style=\"font-family:'Familjen Grotesk','Satoshi',sans-serif;font-weight:600;font-size:19px;color:var(--tx);margin:0 0 12px;line-height:1.15;\">{{ hoverName }}<\u002Fp>\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:12px;\">\n          <span style=\"width:10px;height:10px;border-radius:3px;background:{{ hoverColor }};flex-shrink:0;box-shadow:0 0 8px {{ hoverColor }};\"><\u002Fspan>\n          <span style=\"font-size:12.5px;color:var(--txd);\">{{ hoverCat }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;\">\n          <span style=\"font-size:11px;color:var(--txf);\">Conversion index<\u002Fspan>\n          <span style=\"font-family:ui-monospace,monospace;font-size:13px;color:var(--tx);\">{{ hoverIndex }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"height:7px;border-radius:999px;background:rgba(127,127,127,.2);overflow:hidden;\">\n          <div style=\"height:100%;width:{{ hoverBar }};background:linear-gradient(90deg,var(--gold),#f79d5c);border-radius:999px;transition:width .35s ease;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-top:13px;\">\n          <span style=\"font-size:11px;color:var(--txf);\">Sites mapped<\u002Fspan>\n          <span style=\"font-family:'Familjen Grotesk','Satoshi',sans-serif;font-weight:600;font-size:16px;color:var(--tx);font-variant-numeric:tabular-nums;\">{{ hoverSites }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- zoom control, bottom-right above mode toggle -->\n      <div style=\"position:absolute;bottom:64px;right:24px;z-index:520;display:flex;flex-direction:column;background:var(--glass);backdrop-filter:saturate(160%) blur(20px);-webkit- iv style=\"display:flex;flex-wrap:wrap;gap:7px 14px;max-width:300px;\">\n          <sc-for list=\"{{ legend }}\" as=\"g\" hint-placeholder-count=\"8\">\n            <span style=\"display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--txd);\"><span style=\"width:13px;height:8px;border-radius:2px;background:{{ g.color }};\"><\u002Fspan>{{ g.label }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- centered attribution -->\n      <span style=\"position:absolute;left:0;right:0;bottom:6px;text-align:center;z-index:420;font-family:ui-monospace,monospace;font-size:10.5px;letter-spacing:.04em;color:{{ posterColor }};opacity:.55;\">© OpenStreetMap contributors<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"font-size:11.5px;color:var(--txf);margin:10px 0 0;font-family:ui-monospace,SFMono-Regular,monospace;\">L.geoJSON(eer.json) · hover → setStyle + marching-ants trace · tile-pane CSS filter → single hue<\u002Fp>\n  <\u002Fsection>\n\n  <!-- ════ 01 · COLOR ════ -->\n  <section id=\"color\" style=\"max-width:1180px;margin:0 auto;padding:clamp(44px,6vw,80px) clamp(18px,4vw,40px) 0;scroll-margin-top:80px;\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;margin:0 0 6px;\"><span style=\"font-family:'Familjen Grotesk','Satoshi',sans-serif;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);\">01<\u002Fspan><h2 style=\"font-family:'Familjen Grotesk','Satoshi',sans-serif;font-weight:600;font-size:clamp(24px,3.2vw,34px);margin:0;letter-spacing:-.01em;\">Color<\u002Fh2><\u002Fdiv>\n    <p style=\"font-size:15px;line-height:1.6;color:var(--txd);max-width:64ch;margin:0 0 26px;\">Eight glass hues drawn from leaded windows carry categorical meaning across maps, markers and charts. Gold is the leading — the framing metal — in daylight; Orange takes that role at night. Either way it is the system's single accent.<\u002Fp>\n\n    <p style=\"font-family:'Familjen Grotesk','Satoshi',sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--txf);margin:0 0 14px;\">Glass · categorical palette<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;margin-bottom:40px;\">\n      <div style=\"display:flex;flex-direction:column;gap:9px;\"><div style=\"height:88px;border-radius:13px;background:#ee8434;border:1px solid var(--bd);box-shadow:var(--shadow);\"><\u002Fdiv><div><span style=\"display:block;font-size:13px;font-weight:600;\">Tangerine · leading<\u002Fspan><span style=\"font-family:ui-monospace,monospace;font-size:11.5px;color:var(--txf);\">glass.tangerine · #ee8434<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:9px;\"><div style=\"height:88px;border-radius:13px;background:#f3752b;border:1px solid var(--bd);box-shadow:var(--shadow);\"><\u002Fdiv><div><span style=\"display:block;font-size:13px;font-weight:600;\">Pumpkin<\u002Fspan><span style=\"font-family:ui-monospace,monospace;font-size:11.5px;color:var(--txf);\">glass.pumpkin · #f3752b<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:9px;\"><div style=\"height:88px;border-radius:13px;background:#a20021;border:1px solid var(--bd);box-shadow:var(--shadow);\"><\u002Fdiv><div><span style=\"display:block;font-size:13px;font-weight:600;\">Ruby<\u002Fspan><span style=\"font-family:ui-monospace,monospace;font-size:11.5px;color:var(--txf);\">glass.ruby · #a20021<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:9px;\"><div style=\"height:88px;border-radius:13px;background:#f52f57;border:1px solid var(--bd);box-shadow:var(--shadow);\"><\u002Fdiv><div><span style=\"display:block;font-size:13px;font-weight:600;\">Fuchsia<\u002Fspan><span style=\"font-family:ui-monospace,monospace;font-size:11.5px;color:var(--txf);\">glass.fuchsia · #f52f57<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;flex ull) this.setState({ hoverRegion: null }); }\n  zoomMap(d) { if (this._map) this._map.setZoom(this._map.getZoom() + d); }\n\n  PLATES() {\n    // hueRotate is relative to the sepia base (~amber). tone: \"dark\" inverts to a night plate.\n    return [\n      { name: \"LONDON\", country: \"England\", lat: 51.5074, lon: -0.1278, zoom: 12, coords: \"51.5074° N / 0.1278° W\", color: \"#ee8434\", tone: \"dark\", hr: -6, sat: 2.4 },\n      { name: \"EDINBURGH\", country: \"Scotland\", lat: 55.9533, lon: -3.1883, zoom: 12.4, coords: \"55.9533° N / 3.1883° W\", color: \"#496ddb\", tone: \"light\", hr: 192, sat: 2.0 },\n      { name: \"MANCHESTER\", country: \"England\", lat: 53.4808, lon: -2.2426, zoom: 12.3, coords: \"53.4808° N / 2.2426° W\", color: \"#a20021\", tone: \"light\", hr: -46, sat: 2.2 },\n      { name: \"BRISTOL\", country: \"England\", lat: 51.4545, lon: -2.5879, zoom: 12.4, coords: \"51.4545° N / 2.5879° W\", color: \"#717ec3\", tone: \"light\", hr: 198, sat: 1.7 },\n      { name: \"CARDIFF\", country: \"Wales\", lat: 51.4816, lon: -3.1791, zoom: 12.4, coords: \"51.4816° N / 3.1791° W\", color: \"#c95d63\", tone: \"light\", hr: -34, sat: 1.9 },\n      { name: \"GLASGOW\", country: \"Scotland\", lat: 55.8642, lon: -4.2518, zoom: 12.3, coords: \"55.8642° N / 4.2518° W\", color: \"#f52f57\", tone: \"light\", hr: -50, sat: 2.1 },\n      { name: \"LIVERPOOL\", country: \"England\", lat: 53.4084, lon: -2.9916, zoom: 12.4, coords: \"53.4084° N / 2.9916° W\", color: \"#ae8799\", tone: \"light\", hr: 300, sat: 1.4 },\n      { name: \"BELFAST\", country: \"N. Ireland\", lat: 54.5973, lon: -5.9301, zoom: 12.4, coords: \"54.5973° N / 5.9301° W\", color: \"#f3752b\", tone: \"light\", hr: -16, sat: 2.0 },\n    ];\n  }\n  curPlate() { return this.PLATES()[this.state.plateIndex] || this.PLATES()[0]; }\n  setPlate(i) { const n = this.PLATES().length; this.setState({ plateIndex: ((i % n) + n) % n }); }\n\n  plateFilter() {\n    const p = this.curPlate();\n    // dark line base lateMap.remove(); } catch (e) {} } this._plateMap = null; this._plateEl = null; }\n  }\n  initPlate(el) {\n    if (!window.L) { setTimeout(() => { if (this._plateEl === el) this.initPlate(el); }, 90); return; }\n    const L = window.L;\n    const map = L.map(el, { zoomControl: false, attributionControl: false, dragging: false, scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false, keyboard: false, touchZoom: false, zoomSnap: 0.01, fadeAnimation: true });\n    const p = this.curPlate();\n    map.setView([p.lat, p.lon], p.zoom);\n    L.tileLayer(\"https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png\", { subdomains: \"abcd\", maxZoom: 19, crossOrigin: true }).addTo(map);\n    this._plateMap = map;\n    setTimeout(() => { try { map.invalidateSize(); } catch (e) {} }, 60);\n  }\n  flyPlate() {\n    if (!this._plateMap) return;\n    const p = this.curPlate();\n    this._plateMap.flyTo([p.lat, p.lon], p.zoom, { duration: 0.9 });\n  }\n\n  toggleTheme() {\n    this.setState(s => { const t = s.theme === \"dark\" ? \"light\" : \"dark\"; try { localStorage.setItem(\"tc-theme\", t); } catch (e) {} return { theme: t }; });\n  }\n  setMapMode(m) { this.setState({ mapMode: m }); }\n\n  CATS() {\n    return [\n      { id: \"residential\", label: \"Residential\", color: \"#ee8434\" },\n      { id: \"other_christian\", label: \"Other Christian use\", color: \"#496ddb\" },\n      { id: \"education\", label: \"Education\", color: \"#717ec3\" },\n      { id: \"hospitality\", label: \"Hospitality\", color: \"#c95d63\" },\n      { id: \"commercial\", label: \"Commercial\", color: \"#a20021\" },\n      { id: \"community\", label: \"Community\", color: \"#f52f57\" },\n      { id: \"arts_culture\", label: \"Arts & Culture\", color: \"#f3752b\" },\n      { id: \"unknown\", label: \"Other / unrecorded\", color: \"#ae8799\" },\n    ];\n  }\n  catColor(id) { const c = this.CATS().find(x => x.id === id); return c ? c.color : \"#ae8799\"; }\n\n  // aggregated from where_went_uk_churches_v1.csv (32,531 records) — n: sites, d: density index vs. Scotland, cat: dominant conversion\n  regionData() {\n    return {\n      \"Scotland\": { d: 1.0, cat: \"other_christian\", n: 5291 },\n      \"South West\": { d: 0.78, cat: \"residential\", n: 4148 },\n      \"South East\": { d: 0.66, cat: \"residential\", n: 3473 },\n      \"East of England\": { d: 0.64, cat: \"residential\", n: 3393 },\n      \"Wales\": { d: 0.55, cat: \"other_christian\", n: 2933 },\n      \"East Midlands\": { d: 0.46, cat: \"residential\", n: 2442 },\n      \"West Midlands\": { d: 0.41, cat: \"residential\", n: 2154 },\n      \"North West\": { d: 0.39, cat: \"residential\", n: 2087 },\n      \"Yorkshire & Humber\": { d: 0.39, cat: \"residential\", n: 2050 },\n      \"Northern Ireland\": { d: 0.37, cat: \"other_christian\", n: 1936 },\n      \"London\": { d: 0.23, cat: \"residential\", n: 1212 },\n      \"North East\": { d: 0.16, cat: \"residential\", n: 826 },\n    };\n  }\n  cities() {\n    return [\n      { name: \"London\", region: \"Greater London\", cat: \"community\", lat: 51.507, lon: -0.128, count: 612 },\n      { name: \"Manchester\", region: \"North West\", cat: \"community\", lat: 53.48, lon: -2.24, count: 248 },\n      { name: \"Leeds\", region: \"Yorkshire & Humber\", cat: \"residential\", lat: 53.8, lon: -1.55, count: 194 },\n      { name: \"Cardiff\", region: \"Wales\", cat: \"residential\", lat: 51.48, lon: -3.18, count: 137 },\n      { name: \"Edinburgh\", region: \"Scotland\", cat: \"education\", lat: 55.95, lon: -3.19, count: 121 },\n      { name: \"Bristol\", region: \"South West\", cat: \"arts\", lat: 51.45, lon: -2.59, count: 98 },\n    ];\n  }\n\n  goldRamp(d) {\n    const stops = [\"#3a1c08\", \"#7a3d12\", \"#b35d1f\", \"#ee8434\", \"#f79d5c\"];\n    return stops[Math.min(4, Math.floor(d * 5))];\n  }\n\n  tileUrl() {\n    return this.state.theme === \"dark\"\n      ? \"https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png\"\n      : \"https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png\";\n  }\n\n  setMapHost(el) {\n    if (el && this._mapEl !== el) { this._mapEl = el; this.initMap(el); }\n    else if (!el) { if (this._mapEl && this._wheelPan) { try { this._mapEl.removeEventListener(\"wheel\", this._wheelPan); } catch (e) {} } if (this._map) { try { this._map.remove(); } catch (e) {} } this._map = null; this._mapEl = null; }\n  }\n\n  initMap(el) {\n    if (!window.L) { this._wait = setTimeout(() => { if (this._mapEl === el) this.initMap(el); }, 90); return; }\n    const L = window.L;\n    const map = L.map(el, { zoomControl: false, attributionControl: false, dragging: true, scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false, keyboard: false, touchZoom: true, minZoom: 4, maxZoom: 12, zoomSnap: 0.25 });\n    map.setView([54.6, -3.4], 5.3);\n    this._tile = L.tileLayer(this.tileUrl(), { subdomains: \"abcd\", maxZoom: 19, crossOrigin: true, attribution: \"&copy; OpenStreetMap, &copy; CARTO\" }).addTo(map);\n    this._map = map;\n    // two-finger trackpad / wheel gesture pans the map (does not zoom)\n    this._wheelPan = (e) => {\n      if (e.ctrlKey) return; // pinch-zoom gesture — let it pass\n      e.preventDefault();\n      map.panBy([e.deltaX, e.deltaY], { animate: false });\n    };\n    el.addEventListener(\"wheel\", this._wheelPan, { passive: false });\n    this.loadGeo().then(() => this.drawChoro());\n  }\n\n  markerStyle(c) {\n    return { radius: 6, fillColor: this.catColor(c.cat), color: this.state.theme === \"dark\" ? \"#ECEAF0\" : \"#ffffff\", weight: 1, opacity: 0.9, fillOpacity: 1 };\n  }\n\n  loadGeo() {\n    if (this._geoP) return this._geoP;\n    const urls = [\n      \"https://raw.githubusercontent.com/martinjc/UK-GeoJSON/master/json/electoral/gb/eer.json\",\n      \"https://raw.githubusercontent.com/martinjc/UK-GeoJSON/master/json/electoral/eng/eer.json\",\n    ];\n    const nameMap = {\n      \"North East\": \"North East\", \"North West\": \"North West\", \"Yorkshire and The Humber\": \"Yorkshire & Humber\",\n      \"East Midlands\": \"East Midlands\", \"West Midlands\": \"West Midlands\", \"Eastern\": \"East of England\", \"London\": \"London\",\n      \"South East\": \"South East\", \"South West\": \"South West\", \"Wales\": \"Wales\", \"Scotland\": \"Scotland\",\n    };\n    const tryUrl = (i) => { if (i >= urls.length) return Promise.resolve(null); return fetch(urls[i]).then(r => { if (!r.ok) throw 0; return r.json(); }).catch(() => tryUrl(i + 1)); };\n    this._geoP = tryUrl(0).then(gj => {\n      if (gj && gj.features) for (const f of gj.features) { const nm = (f.properties && (f.properties.EER13NM || f.properties.name)) || \"\"; f.properties = f.properties || {}; f.properties.tcRegion = nameMap[nm] || nm; }\n      this._geo = gj; return gj;\n    });\n    return this._geoP;\n  }\n\n  choroStyle(region) {\n    const data = this.regionData()[region];\n    const dark = this.state.theme === \"dark\";\n    if (!data) return { color: \"#ae8799\", weight: 1, opacity: 0.4, fillColor: \"#ae8799\", fillOpacity: dark ? 0.05 : 0.06, className: \"tc-region\" };\n    if (this.state.mapMode === \"density\") {\n      return { color: \"#f79d5c\", weight: 1.4, opacity: dark ? 0.95 : 0.85, fillColor: \"#ee8434\", fillOpacity: (dark ? 0.1 : 0.14) + data.d * (dark ? 0.42 : 0.48), className: \"tc-region\" };\n    }\n    const col = this.catColor(data.cat);\n    return { color: col, weight: 1.8, opacity: dark ? 1 : 0.9, fillColor: col, fillOpacity: dark ? 0.42 : 0.46, className: \"tc-region\" };\n  }\n\n  drawChoro() {\n    const map = this._map, L = window.L; if (!map || !L || !this._geo) return;\n    if (this._choro) { try { map.removeLayer(this._choro); } catch (e) {} }\n    const self = this;\n    this._choro = L.geoJSON(this._geo, {\n      style: f => this.choroStyle(f.properties.tcRegion),\n      onEachFeature: (f, layer) => {\n        const region = f.properties.tcRegion; const data = this.regionData()[region];\n        if (data) layer.bindTooltip(\"<b>\" + region + \"<\u002Fb><br>\" + this.CATS().find(x => x.id === data.cat).label + \" · index \" + Math.round(data.d * 100), { className: \"tc-tip\", sticky: true });\n        layer.on(\"mouseover\", function () { this.setStyle({ weight: 3.2, fillOpacity: Math.min(0.68, self.choroStyle(region).fillOpacity + 0.18) }); this.bringToFront(); self.setHover(region); });\n        layer.on(\"mouseout\", function () { self._choro.resetStyle(this); self.clearHover(); });\n      },\n    }).addTo(map);\n    this._choro.bringToBack();\n    if (!this._fitted) {\n      this._fitted = true;\n      try { this._map.fitBounds(this._choro.getBounds(), { paddingTopLeft: [40, 70], paddingBottomRight: [40, 60] }); } catch (e) {}\n    }\n  }\n\n  refreshChoro() {\n    if (this._choro) this._choro.eachLayer(l => { try { l.setStyle(this.choroStyle(l.feature.properties.tcRegion)); } catch (e) {} });\n  }\n\n  applyTheme() {\n    if (this._tile) this._tile.setUrl(this.tileUrl());\n    this.refreshChoro();\n  }\n\n  donutBuild() {\n    // national conversion-type totals from the dataset (32,531 records)\n    const rows = [\n      { id: \"residential\", n: 14716 }, { id: \"other_christian\", n: 9491 }, { id: \"education\", n: 2811 },\n      { id: \"hospitality\", n: 1578 }, { id: \"commercial\", n: 1018 }, { id: \"unknown\", n: 2917 },\n    ];\n    const total = 32531;\n    const C = 2 * Math.PI * 46; let acc = 0;\n    const segs = rows.map(r => { const len = r.n / total * C; const seg = { color: this.catColor(r.id), dash: len.toFixed(2) + \" \" + C.toFixed(2), offset: (-acc).toFixed(2) }; acc += len; return seg; });\n    const drows = rows.map(r => ({ label: this.CATS().find(x => x.id === r.id).label, color: this.catColor(r.id), pct: (r.n / total * 100).toFixed(0) + \"%\" }));\n    return { segs, drows };\n  }\n\n  renderVals() {\n    const dark = this.state.theme === \"dark\";\n    const cats = this.CATS();\n    const mapTabs = [[\"category\", \"Category\"], [\"density\", \"Density\"]].map(([id, label]) => ({\n      label, go: () => this.setMapMode(id),\n      bg: this.state.mapMode === id ? \"var(--gold)\" : \"transparent\",\n      color: this.state.mapMode === id ? \"#0E1220\" : \"var(--txd)\",\n    }));\n    const bars = Object.values(this.regionData()).map(r => r.d).sort((a, b) => a - b).map(d => ({ h: Math.round(14 + d * 86) + \"%\" }));\n    const locations = this.cities().map(c => ({ name: c.name, region: c.region, count: c.count, color: this.catColor(c.cat) }));\n    const legend = (this.state.mapMode === \"density\"\n      ? [[\"Low\", \"#7a3d12\"], [\"\", \"#b35d1f\"], [\"\", \"#ee8434\"], [\"High\", \"#f79d5c\"]].map(([label, color]) => ({ label, color }))\n      : cats.slice(0, 8).map(c => ({ label: c.label, color: c.color })));\n    const legendTitle = this.state.mapMode === \"density\" ? \"Site density\" : \"Dominant conversion\";\n    const d = this.donutBuild();\n\n    // hover-card values for the national plate\n    const hr = this.state.hoverRegion;\n    const hd = hr ? this.regionData()[hr] : null;\n    const hoverColor = hd ? (this.state.mapMode === \"density\" ? \"#ee8434\" : this.catColor(hd.cat)) : \"var(--gold)\";\n    const hoverInfo = hd\n      ? { kicker: \"Region\", name: hr, cat: this.CATS().find(x => x.id === hd.cat).label, index: Math.round(hd.d * 100), bar: Math.round(hd.d * 100) + \"%\", sites: hd.n.toLocaleString() }\n      : { kicker: \"Hover to inspect\", name: \"United Kingdom\", cat: \"Residential-led · 45%\", index: 45, bar: \"45%\", sites: \"32,531\" };\n\n    const p = this.curPlate();\n    const plateDots = this.PLATES().map((pl, i) => ({\n      go: () => this.setPlate(i),\n      bg: i === this.state.plateIndex ? pl.color : \"rgba(140,140,140,.45)\",\n      size: i === this.state.plateIndex ? \"26px\" : \"8px\",\n    }));\n\n    return {\n      theme: this.state.theme,\n      themeIcon: dark ? \"☀\" : \"☾\",\n      toggleTheme: () => this.toggleTheme(),\n      setMapHost: this.setMapRef,\n      setPlateHost: this.setPlateRef,\n      plateFilter: this.plateFilter(),\n      plateScrim: this.plateScrim(),\n      plateBg: p.tone === \"dark\" ? \"#0c0a06\" : \"#f4f1e9\",\n      plateLine: p.tone === \"dark\" ? \"rgba(255,255,255,.14)\" : \"rgba(0,0,0,.12)\",\n      plateColor: p.color,\n      plateName: p.name,\n      plateCountry: p.country,\n      plateCoords: p.coords,\n      plateDots,\n      prevPlate: () => this.setPlate(this.state.plateIndex - 1),\n      nextPlate: () => this.setPlate(this.state.plateIndex + 1),\n      zoomIn: () => this.zoomMap(0.5),\n      zoomOut: () => this.zoomMap(-0.5),\n      mapTabs, bars, locations, legend, legendTitle,\n      posterBg: dark ? \"#0d1017\" : \"#e9edf0\",\n      posterScrim: dark\n        ? \"linear-gradient(180deg,rgba(6,8,14,.4) 0%,rgba(6,8,14,0) 26%,rgba(6,8,14,0) 50%,rgba(6,8,14,.6) 100%)\"\n        : \"linear-gradient(180deg,rgba(255,255,255,.4) 0%,rgba(255,255,255,0) 26%,rgba(255,255,255,0) 50%,rgba(255,255,255,.55) 100%)\",\n      posterLine: dark ? \"rgba(229,229,235,.16)\" : \"rgba(40,50,60,.18)\",\n      posterColor: dark ? \"#f79d5c\" : \"#a8410f\",\n      posterTitle: \"UNITED KINGDOM\",\n      posterSub: legendTitle,\n      hoverKicker: hoverInfo.kicker,\n      hoverName: hoverInfo.name,\n      hoverCat: hoverInfo.cat,\n      hoverColor: hoverColor,\n      hoverIndex: hoverInfo.index,\n      hoverBar: hoverInfo.bar,\n      hoverSites: hoverInfo.sites,\n      metricValue: \"32,531\", metricDelta: \"45% homes\", metricLabel: \"Former churches mapped · UK-wide\",\n      donut: d.segs, donutRows: d.drows,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
