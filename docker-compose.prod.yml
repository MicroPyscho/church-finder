version: "3.9"

services:

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER:     ${DB_USER:?DB_USER must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB:       churchfinder_prod
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  backend:
    image: ${IMAGE_TAG:?IMAGE_TAG must be set}
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV:          prod
      APP_VERSION:  ${APP_VERSION:?APP_VERSION must be set}
      DATABASE_URL: "postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/churchfinder_prod"
      SECRET_KEY:   ${SECRET_KEY:?SECRET_KEY must be set}
      CORS_ORIGINS: '["${PROD_FRONTEND_URL:?PROD_FRONTEND_URL must be set}"]'
      NOTIFY_METHOD: ${NOTIFY_METHOD:-email}
      SMTP_HOST:     ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT:     ${SMTP_PORT:-587}
      SMTP_USER:     ${SMTP_USER:?SMTP_USER must be set}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD must be set}
      NOTIFY_EMAIL_TO: ${NOTIFY_EMAIL_TO:?NOTIFY_EMAIL_TO must be set}
      WEBHOOK_URL:   ${WEBHOOK_URL:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  nginx:
    image: nginx:alpine
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./frontend/dist:/usr/share/nginx/html:ro

volumes:
  postgres_prod_data:
  