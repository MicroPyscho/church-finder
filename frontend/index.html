<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Nave — The UK's Dedicated Church & Chapel Property Search</title>
    <meta name="description" content="Search 100+ churches, chapels and places of worship for sale across the UK. Aggregated from 30+ sources including auction houses, estate agents and ecclesiastical bodies." />
    <meta name="keywords" content="churches for sale UK, chapels for sale, place of worship for sale, ecclesiastical property, former church conversion, church auction UK, nave" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Nave" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="Nave — The UK's Dedicated Church & Chapel Property Search" />
    <meta property="og:description" content="Search 100+ churches, chapels and places of worship for sale across the UK." />
    <meta property="og:site_name"   content="Nave" />
    <meta property="og:locale"      content="en_GB" />
    <meta property="og:image"       content="/nave-logo-black.png" />

    <!-- Twitter -->
    <meta name="twitter:card"        content="summary" />
    <meta name="twitter:title"       content="Nave — UK Church & Chapel Property Search" />
    <meta name="twitter:description" content="Search 100+ churches, chapels and places of worship for sale across the UK." />
    <meta name="twitter:image"       content="/nave-logo-black.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://nave.church" />

    <!-- Favicons — switches with browser dark mode -->
    <link id="favicon" rel="icon" type="image/svg+xml" href="/nave-favicon.svg" />
    <link rel="apple-touch-icon" href="/nave-logo-black.png" />
    <script>
      (function() {
        function setFavicon() {
          var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var el = document.getElementById("favicon");
          if (el) el.setAttribute("href", dark ? "/nave-favicon-white.svg" : "/nave-favicon.svg");
        }
        setFavicon();
        if (window.matchMedia) {
          window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", setFavicon);
        }
      })();
    </script>

    <!-- Umami Analytics -->
    <script async src="http://localhost:3001/script.js" data-website-id="42f3db1c-5b97-433b-aa45-f021ee544ac7"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
