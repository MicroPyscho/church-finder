<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Sanctuary — UK Church & Chapel Property Search</title>
    <meta name="description" content="Search 100+ churches, chapels and places of worship for sale across the UK. Aggregated from 30+ sources including auction houses, estate agents and ecclesiastical bodies." />
    <meta name="keywords" content="churches for sale UK, chapels for sale, place of worship for sale, ecclesiastical property, former church conversion, church auction UK" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Sanctuary" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="Sanctuary — UK Church & Chapel Property Search" />
    <meta property="og:description" content="Search 100+ churches, chapels and places of worship for sale across the UK." />
    <meta property="og:site_name"   content="Sanctuary" />
    <meta property="og:locale"      content="en_GB" />

    <!-- Twitter -->
    <meta name="twitter:card"        content="summary" />
    <meta name="twitter:title"       content="Sanctuary — UK Church & Chapel Property Search" />
    <meta name="twitter:description" content="Search 100+ churches, chapels and places of worship for sale across the UK." />

    <!-- Canonical -->
    <link rel="canonical" href="https://sanctuary.church" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>⛪</text></svg>" />

    <!-- Schema.org organisation markup -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Sanctuary",
      "description": "UK church and chapel property search aggregating 30+ sources",
      "url": "https://sanctuary.church",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://sanctuary.church/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
